name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, android-port]
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "art/**"
      - "build/**"
      - "Project.xml"
      - ".github/workflows/Android.yml"
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "Project.xml"
      - ".github/workflows/Android.yml"

jobs:
  buildAndroid:
    name: Build Leather Engine APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # The lime fork used by this engine needs Gradle 8.9 / Android Gradle Plugin 8.7, which require Java 17.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # The runner image already ships the Android SDK, only the pieces lime asks for are added.
      - name: Install Android SDK / NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          chmod +x ./build/install_libraries.sh
          ./build/install_libraries.sh
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib list

      # lime is installed from git, so its command line tool has to be compiled before it can be used.
      - name: Build the lime command line tool
        run: |
          cd "$(haxelib libpath lime)/tools"
          haxe run.hxml

      # Tells lime where the Android tools are, this replaces the interactive `lime setup android`.
      - name: Configure lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      # Release APKs have to be signed to be installable. This is a throw-away key made for the build,
      # so a fresh APK can't be installed over one built by another run (uninstall the old one first).
      # To keep updating in place, store your own keystore in the repository secrets and use it here instead.
      - name: Create a signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/leather.keystore" -alias leather \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass leatherengine -keypass leatherengine \
            -dname "CN=Leather Engine, O=Leather Engine, C=US"

      - name: Build APK
        run: |
          haxelib run lime build Project.xml android -release -arm64 \
            -certificate-path="$RUNNER_TEMP/leather.keystore" \
            -certificate-password=leatherengine \
            -certificate-alias=leather \
            -certificate-alias-password=leatherengine

      - name: Find the APK
        run: find export -name "*.apk" -o -name "*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeatherEngine-Android
          path: export/**/outputs/apk/**/*.apk
          if-no-files-found: error
