name: Build Leather Engine Android

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "Project.xml"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build Leather Engine APK
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # JAVA 17
      # ========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

      # ========================================
      # HAXE 4.2.5
      # ========================================

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.2.5"

      - name: Check Haxe
        run: |
          haxe --version
          haxelib version

      # ========================================
      # ANDROID SDK
      # ========================================

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager --version

      - name: Accept Android Licenses
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"
          sdkmanager "ndk;21.4.7075529"

      # ========================================
      # ANDROID NDK
      # ========================================

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      # ========================================
      # HAXELIB
      # ========================================

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      # ========================================
      # CORE HAXELIBS
      # ========================================

      - name: Install Core Haxelibs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flxanimate
          haxelib install hxvlc
          haxelib install grig.audio

      # ========================================
      # HSCRIPT IMPROVED
      # ========================================

      - name: Install HScript Improved
        run: |
          haxelib git hscript-improved https://github.com/FNF-CNE-Devs/hscript-improved.git

      # ========================================
      # FUNKIN.VIS
      # ========================================

      - name: Install funkin.vis
        run: |
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git

      # ========================================
      # HXNOISE
      # ========================================

      - name: Install hxNoise
        run: |
          git clone --depth 1 https://github.com/whuop/hxNoise.git /tmp/hxNoise
          haxelib dev hxnoise /tmp/hxNoise

      # ========================================
      # LUAJIT
      # ========================================

      - name: Install LuaJIT
        run: |
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git

      # ========================================
      # MODCHARTING TOOLS
      # ========================================

      - name: Install Modcharting Tools
        run: |
          haxelib git fnf-modcharting-tools https://github.com/TheZoroForce240/FNF-Modcharting-Tools.git

      # ========================================
      # PREPARE ANDROID PROJECT
      # ========================================

      - name: Prepare Android Project
        run: |
          cp Project.xml Project.android.backup.xml

          python3 <<'PY'
          from pathlib import Path

          p = Path("Project.xml")
          text = p.read_text()

          # ----------------------------------------
          # DISCORD DESKTOP ONLY
          # ----------------------------------------

          text = text.replace(
              '<define name="DISCORD_ALLOWED" />',
              '<define name="DISCORD_ALLOWED" if="desktop" />'
          )

          # ----------------------------------------
          # LUA DESKTOP ONLY
          # ----------------------------------------

          text = text.replace(
              '<define name="LUA_ALLOWED" />',
              '<define name="LUA_ALLOWED" if="desktop" />'
          )

          # ----------------------------------------
          # MODDING DESKTOP ONLY
          # ----------------------------------------

          text = text.replace(
              '<define name="MODDING_ALLOWED" />',
              '<define name="MODDING_ALLOWED" if="desktop" />'
          )

          # ----------------------------------------
          # REMOVE SCRIPTLESS POLYMOD
          # ----------------------------------------

          text = text.replace(
              '<haxelib name="scriptless-polymod" if="MODDING_ALLOWED" />',
              ''
          )

          p.write_text(text)
          PY

          echo "========================================"
          echo "ANDROID PROJECT PREPARED"
          echo "========================================"

          echo "Checking MODDING_ALLOWED:"
          grep -n "MODDING_ALLOWED" Project.xml || true

          echo "Checking scriptless-polymod:"
          if grep -q "scriptless-polymod" Project.xml; then
            echo "ERROR: scriptless-polymod still exists!"
            exit 1
          else
            echo "OK: scriptless-polymod removed."
          fi

          echo "Checking Discord:"
          grep -n "DISCORD_ALLOWED" Project.xml || true

          echo "Checking Lua:"
          grep -n "LUA_ALLOWED" Project.xml || true

      # ========================================
      # CHECK POLYMOD
      # ========================================

      - name: Check Android Modding Configuration
        run: |
          echo "Android modding configuration:"
          grep -n "MODDING_ALLOWED" Project.xml || true

          echo ""
          echo "Searching for scriptless-polymod:"
          if grep -R "scriptless-polymod" Project.xml source 2>/dev/null; then
            echo "WARNING: source still references scriptless-polymod."
          else
            echo "No scriptless-polymod reference found in Project.xml/source."
          fi

      # ========================================
      # LIME SETUP
      # ========================================

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup flixel

      # ========================================
      # CONFIGURE LIME
      # ========================================

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"

      # ========================================
      # VERIFY ENVIRONMENT
      # ========================================

      - name: Verify Environment
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo "========================================"
          echo "HAXE"
          echo "========================================"

          haxe --version

          echo "========================================"
          echo "HAXELIBS"
          echo "========================================"

          haxelib list

          echo "========================================"
          echo "LIME"
          echo "========================================"

          haxelib list | grep -E "^lime:"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sdkmanager --version

          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          test -d "$ANDROID_NDK_ROOT"
          echo "$ANDROID_NDK_ROOT"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          test -f Project.xml
          echo "Project.xml found."

          echo "========================================"
          echo "SCRIPTLESS POLYMOD"
          echo "========================================"

          if grep -q "scriptless-polymod" Project.xml; then
            echo "ERROR: scriptless-polymod is still present."
            exit 1
          else
            echo "OK: scriptless-polymod is disabled for Android."
          fi

          echo "========================================"
          echo "ENVIRONMENT OK"
          echo "========================================"

      # ========================================
      # BUILD APK
      # ========================================

      - name: Build Android APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "========================================"
          echo "BUILDING LEATHER ENGINE ANDROID"
          echo "========================================"

          haxelib run lime build android -release

      # ========================================
      # FIND APK
      # ========================================

      - name: Find APK
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print

      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeatherEngine-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
