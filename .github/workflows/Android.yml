name: Build Leather Engine Android

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "Project.xml"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build Leather Engine APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # JAVA 17
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

      # ==============================
      # HAXE
      # ==============================

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.2.5"

      - name: Check Haxe
        run: |
          haxe --version
          haxelib version

      # ==============================
      # ANDROID SDK
      # ==============================

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager --version

      - name: Accept Android Licenses
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      # ==============================
      # HAXELIB
      # ==============================

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      # ==============================
      # CORE DEPENDENCIES
      # ==============================

      - name: Install Core Haxelibs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flxanimate
          haxelib install hxvlc
          haxelib install grig.audio

      # ==============================
      # HXSCRIPT
      # ==============================

      - name: Install HScript Improved
        run: |
          haxelib git hscript-improved https://github.com/FNF-CNE-Devs/hscript-improved.git

      # ==============================
      # FUNKIN VIS
      # ==============================

      - name: Install funkin.vis
        run: |
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git

      # ==============================
      # HXNOISE
      # ==============================

      - name: Install hxNoise
        run: |
          git clone --depth 1 https://github.com/whuop/hxNoise.git /tmp/hxNoise
          haxelib dev hxnoise /tmp/hxNoise

      # ==============================
      # LUAJIT
      # ==============================

      - name: Install LuaJIT
        run: |
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git

      # ==============================
      # MODCHARTING TOOLS
      # ==============================

      - name: Install Modcharting Tools
        run: |
          haxelib git fnf-modcharting-tools https://github.com/TheZoroForce240/FNF-Modcharting-Tools.git

      # ==============================
      # PREPARE ANDROID PROJECT
      # ==============================

      - name: Prepare Android Project
        run: |
          cp Project.xml Project.android.backup.xml

          python3 <<'PY'
          from pathlib import Path

          p = Path("Project.xml")
          text = p.read_text()

          # Disable desktop-only Discord support.
          text = text.replace(
              '<define name="DISCORD_ALLOWED" />',
              '<define name="DISCORD_ALLOWED" if="desktop" />'
          )

          # Lua is desktop-only in the original Leather project.
          text = text.replace(
              '<define name="LUA_ALLOWED" />',
              '<define name="LUA_ALLOWED" if="desktop" />'
          )

          p.write_text(text)
          PY

          echo "Android Project.xml prepared."

          grep -n "DISCORD_ALLOWED" Project.xml || true
          grep -n "LUA_ALLOWED" Project.xml || true

      # ==============================
      # SCRIPTLESS POLYMOD CHECK
      # ==============================

      - name: Check Scriptless Polymod
        run: |
          echo "Checking scriptless-polymod..."

          if haxelib list | grep -qi "scriptless-polymod"; then
            echo "scriptless-polymod is installed."
          elif find . -type d -iname "*scriptless*polymod*" | grep -q .; then
            echo "Local scriptless-polymod detected."
          else
            echo "scriptless-polymod is not installed."
            echo "Continuing so the exact Project.xml/build error can identify whether it is required."
          fi

      # ==============================
      # LIME
      # ==============================

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup flixel

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"

      # ==============================
      # ENVIRONMENT CHECK
      # ==============================

      - name: Verify Environment
        run: |
          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo "=============================="
          echo "HAXE"
          echo "=============================="
          haxe --version

          echo "=============================="
          echo "HAXELIBS"
          echo "=============================="
          haxelib list

          echo "=============================="
          echo "LIME"
          echo "=============================="
          haxelib run lime version

          echo "=============================="
          echo "ANDROID"
          echo "=============================="
          sdkmanager --version

          echo "=============================="
          echo "NDK"
          echo "=============================="
          test -d "$ANDROID_NDK_ROOT"
          echo "$ANDROID_NDK_ROOT"

          echo "=============================="
          echo "PROJECT"
          echo "=============================="
          test -f Project.xml
          echo "Project.xml found."

      # ==============================
      # BUILD APK
      # ==============================

      - name: Build Android APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "================================"
          echo "BUILDING LEATHER ENGINE ANDROID"
          echo "================================"

          haxelib run lime build android -release

      # ==============================
      # FIND APK
      # ==============================

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ==============================
      # UPLOAD APK
      # ==============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeatherEngine-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
