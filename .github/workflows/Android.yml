name: Build Leather Engine Android

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "Project.xml"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.2.5"

      - name: Setup Android SDK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "Using Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529"

      - name: Setup Haxelib
        shell: bash
        run: |
          haxelib setup ~/haxelib

      - name: Install Haxelib dependencies
        shell: bash
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install polymod
          haxelib install flixelTextureAtlas
          haxelib install hxCodec

      - name: Setup Lime
        shell: bash
        run: |
          haxelib run lime setup
          haxelib run lime setup flixel

      - name: Configure Lime
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"

      - name: Check Environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== HAXE ====="
          haxe --version

          echo "===== LIME ====="
          haxelib run lime version

          echo "===== ANDROID ====="
          sdkmanager --version

          echo "===== PROJECT ====="
          test -f Project.xml
          echo "Project.xml found."

      - name: Build Android APK
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          haxelib run lime build android -release

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeatherEngine-Android
          path: |
            export/**/*.apk
          if-no-files-found: error
