name: Build Leather Engine Android

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "assets/**"
      - "mods/**"
      - "Project.xml"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build Leather Engine APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

      # --------------------------------------------------
      # HAXE
      # --------------------------------------------------

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.2.5"

      - name: Check Haxe
        run: |
          haxe --version
          haxelib version

      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager --version

      - name: Accept Android Licenses
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # HAXELIB
      # --------------------------------------------------

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      # --------------------------------------------------
      # CORE LIBRARIES
      # --------------------------------------------------

      - name: Install Core Haxelibs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flxanimate
          haxelib install hxvlc
          haxelib install hxNoise
          haxelib install grig.audio

      # --------------------------------------------------
      # GIT LIBRARIES
      # --------------------------------------------------

      - name: Install Git Libraries
        run: |
          haxelib git hscript-improved https://github.com/FNF-CNE-Devs/hscript-improved.git
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git

          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git

          haxelib git fnf-modcharting-tools https://github.com/TheZoroForce240/FNF-Modcharting-Tools.git

      # --------------------------------------------------
      # OPTIONAL / ANDROID-INCOMPATIBLE FEATURES
      # --------------------------------------------------

      - name: Prepare Project for Android
        run: |
          cp Project.xml Project.android.xml

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Project.xml")
          text = p.read_text()

          # Disable desktop-oriented features for Android.
          text = text.replace(
              '<define name="DISCORD_ALLOWED" />',
              '<!-- <define name="DISCORD_ALLOWED" /> -->'
          )

          text = text.replace(
              '<define name="LUA_ALLOWED" />',
              '<!-- <define name="LUA_ALLOWED" /> -->'
          )

          text = text.replace(
              '<haxelib name="hxdiscord_rpc" if="DISCORD_ALLOWED" />',
              '<haxelib name="hxdiscord_rpc" if="DISCORD_ALLOWED" />'
          )

          p.write_text(text)
          PY

          echo "Android Project.xml prepared."

          grep -n "DISCORD_ALLOWED" Project.xml || true
          grep -n "LUA_ALLOWED" Project.xml || true

      # --------------------------------------------------
      # CHECK SCRIPTLESS POLYMOD
      # --------------------------------------------------

      - name: Check Scriptless Polymod
        run: |
          echo "Checking scriptless-polymod..."

          if haxelib list | grep -qi "scriptless-polymod"; then
            echo "scriptless-polymod already installed."
          elif find . -type d -iname "*scriptless*polymod*" | grep -q .; then
            echo "Local scriptless-polymod found."
          else
            echo "WARNING: scriptless-polymod was not found."
            echo "The build may require the original dependency source."
          fi

      # --------------------------------------------------
      # LIME
      # --------------------------------------------------

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup flixel

      - name: Configure Lime Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"

      # --------------------------------------------------
      # VERIFY ENVIRONMENT
      # --------------------------------------------------

      - name: Verify Environment
        run: |
          echo "================================"
          echo "JAVA"
          echo "================================"
          java -version

          echo "================================"
          echo "HAXE"
          echo "================================"
          haxe --version

          echo "================================"
          echo "HAXELIBS"
          echo "================================"
          haxelib list

          echo "================================"
          echo "LIME"
          echo "================================"
          haxelib run lime version

          echo "================================"
          echo "ANDROID"
          echo "================================"
          sdkmanager --version

          echo "================================"
          echo "NDK"
          echo "================================"
          ls -la "$ANDROID_NDK_ROOT"

          echo "================================"
          echo "PROJECT"
          echo "================================"
          test -f Project.xml

          echo "Project.xml OK."

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build Android APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Starting Leather Engine Android build..."

          haxelib run lime build android -release

      # --------------------------------------------------
      # FIND APK
      # --------------------------------------------------

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeatherEngine-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
